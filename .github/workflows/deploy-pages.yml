name: Deploy GitHub Pages from build/web

on:
  push:
    branches:
      - main  # ou master si ton repo utilise "master"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js (optionnel si build web dépend de Node)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Copy build/web to docs
        run: |
          rm -rf docs
          mkdir docs
          cp -r build/web/* docs/

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs
          git commit -m "Deploy to docs" || echo "No changes to commit"
          git push

